# Défauts config admin « booking » — fusionnés dans le paramètre configs si HermesBookingBundle est installé.
booking:
  booking_bgcolor:
    summary: Couleur de fond du formulaire de réservation
    value: 'transparent'
    position: 5
  booking_reservation_form:
    summary: Couleur de fond du bloc formulaire booking_reservation_form
    value: '#ffffff'
    position: 6
  booking_color:
    summary: Couleur des textes du formulaire de réservation
    value: '#000000'
    position: 4
  booking_color_btn:
    summary: Couleur du texte du bouton de réservation (optionnel, prioritaire sur la classe Bootstrap)
    value: ~
    position: 7
  booking_button_bgcolor:
    summary: Couleur de fond du bouton de réservation (optionnel, inversée au survol avec la couleur du texte)
    value: ~
    position: 13
  booking_width:
    summary: Largeur du bloc réservation (max = 12)
    value: 12
    position: 3
  booking_bgcolor_input:
    summary: Couleur de fond des champs du formulaire de réservation
    value: '#ffffff'
    position: 9
  booking_color_input:
    summary: Couleur du texte des champs du formulaire de réservation
    value: '#000000'
    position: 8
  booking_rounded_input:
    summary: Arrondi des champs (max = 5)
    value: 0
    position: 10
  booking_py_input:
    summary: Padding vertical des champs (max = 5)
    value: 2
    position: 11
  booking_my_input:
    summary: Marge verticale des champs (max = 5)
    value: 2
    position: 12
  booking_border_color_input:
    summary: Couleur de bordure des champs du formulaire de réservation
    value: '#dee2e6'
    position: 14
