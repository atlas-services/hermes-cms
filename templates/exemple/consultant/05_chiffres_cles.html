<!-- Consultant — Chiffres en tableau (gsap-count-up). Couleurs : config Hermes. -->
<section class="py-5">
    <div class="container col-lg-10">
        <p class="text-uppercase small fw-semibold text-center mb-2" style="letter-spacing: 0.14em;">En quelques chiffres</p>
        <h2 class="h3 fw-bold text-center mb-4">Une expertise reconnue</h2>
        <div class="table-responsive border rounded-3 shadow-sm">

                <tbody>
                    <tr>
                        <th scope="row" class="fw-semibold p-4">Expérience</th>

                    <tr>

                    </tr>
                    <tr>
                        <th scope="row" class="fw-semibold p-4">Délai de proposition</th>
                        <td class="display-6 fw-bold p-4"><span data-gsap-count-up="72" data-gsap-count-up-duration="1.2">72</span>h</td>

            </table>
        </div>
    </div>
</section>
