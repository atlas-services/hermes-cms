<!-- Menuisier / ébéniste — hero-split (forme maison) + Splide réalisations -->
<div class="gsap-hero-split gsap-hero-split--flush gsap-hero-split--vh text-body" style="--gsap-hero-split-h: 55; --gsap-letter-reveal-color: #5c4033; --gsap-shape-build-color: #8b5a2b;">
    <div class="row mx-0 g-0 align-items-stretch">
        <div class="col-12 col-lg-6 order-lg-2">
            <div class="gsap-shape-build gsap-hero-split__pane" style="--gsap-shape-build-color: #8b5a2b;">
                <div class="gsap-shape-build__stage">
                    <svg class="gsap-shape-build__svg" viewBox="0 0 200 160" aria-hidden="true">
                        <path class="gsap-shape-build__path" d="M20 120 L100 30 L180 120 Z"/>
                        <path class="gsap-shape-build__path" d="M50 120 L50 80 L90 80 L90 120"/>
                        <path class="gsap-shape-build__path" d="M110 120 L110 95 L150 95 L150 120"/>
                        <path class="gsap-shape-build__path" d="M85 120 L85 100 L115 100 L115 120"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-6 order-lg-1 d-flex align-items-center bg-light">
            <div class="p-4 p-lg-5 w-100 text-center text-lg-start">
                <p class="text-uppercase small fw-semibold text-secondary mb-2" style="letter-spacing: 0.18em;">Menuiserie · agencement</p>
                <div class="gsap-letter-reveal" style="--gsap-letter-reveal-color: #3d2914;">
                    <p
                        class="gsap-letter-reveal__line display-5 fw-bold mb-3"
                        data-gsap-letter-reveal-text-value="Bois sur mesure"
                        aria-label="Bois sur mesure"
                    >Bois sur mesure</p>
                </div>
                <p class="lead text-muted mb-4">Cuisines, escaliers, placards et terrasses — fabrication locale, finitions soignées.</p>
                <a class="btn btn-dark btn-lg" href="/fr/contact">Demander un devis</a>
            </div>
        </div>
    </div>
</div>

<div id="hermes-metier-artisan-menuisier" class="text-body">
    <section class="container py-5">
        <h2 class="h4 fw-bold text-center mb-4">Nos réalisations</h2>
        <div
            class="splide splide-carousel"
            style="--splide-carousel-accent: #8b5a2b;"
            aria-label="Galerie menuiserie"
            data-splide-carousel-effect-value="focus"
            data-splide-carousel-per-page-value="3"
            data-splide-carousel-per-page-mobile-value="1"
            data-splide-carousel-gap-value="1rem"
        >
            <div class="splide__track">
                <ul class="splide__list">
                    <li class="splide__slide">
                        <img class="img-fluid rounded shadow w-100" src="https://picsum.photos/seed/menuiserie-1/800/600" alt="Cuisine sur mesure" width="800" height="600" loading="lazy">
                    </li>
                    <li class="splide__slide">
                        <img class="img-fluid rounded shadow w-100" src="https://picsum.photos/seed/menuiserie-2/800/600" alt="Escalier chêne" width="800" height="600" loading="lazy">
                    </li>
                    <li class="splide__slide">
                        <img class="img-fluid rounded shadow w-100" src="https://picsum.photos/seed/menuiserie-3/800/600" alt="Bibliothèque" width="800" height="600" loading="lazy">
                    </li>
                    <li class="splide__slide">
                        <img class="img-fluid rounded shadow w-100" src="https://picsum.photos/seed/menuiserie-4/800/600" alt="Terrasse bois" width="800" height="600" loading="lazy">
                    </li>
                </ul>
            </div>
        </div>
    </section>

    <section class="bg-dark text-white py-5">
        <div class="container">
            <div class="row g-4 text-center">
                <div class="col-md-4">
                    <p class="display-6 fw-bold text-warning mb-1">25</p>
                    <p class="small text-white-50 mb-0 text-uppercase">années d’expérience</p>
                </div>
                <div class="col-md-4">
                    <p class="display-6 fw-bold text-warning mb-1">100&nbsp;%</p>
                    <p class="small text-white-50 mb-0 text-uppercase">bois certifiés PEFC</p>
                </div>
                <div class="col-md-4">
                    <p class="display-6 fw-bold text-warning mb-1">48h</p>
                    <p class="small text-white-50 mb-0 text-uppercase">devis sous 48 h</p>
                </div>
            </div>
        </div>
    </section>
</div>
