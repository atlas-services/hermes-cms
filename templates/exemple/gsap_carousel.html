<div class="content-showcase content-showcase--palette-cool text-body py-3">
    <p class="text-center text-muted small mb-4 px-2">
        <code>.gsap-carousel</code> — glissement GSAP, boutons, pastilles, <strong>swipe</strong> (doigt / souris).
        Sans ScrollTrigger. Init <code>js-front.js</code>.
    </p>

    <div
        class="gsap-carousel mx-auto rounded-3 shadow overflow-hidden"
        style="--gsap-carousel-accent: #0d6efd; max-width: 54rem;"
        data-gsap-carousel-mode-value="slide"
        data-gsap-carousel-duration-value="0.6"
        data-gsap-carousel-ease-value="power3.out"
        data-gsap-carousel-autoplay-value="true"
        data-gsap-carousel-interval-value="4500"
    >
        <div class="gsap-carousel__viewport gsap-carousel__viewport--fixed" aria-live="polite">
            <div class="gsap-carousel__track">
                <figure class="gsap-carousel__slide is-active rounded-0 mb-0 overflow-hidden">
                    <img src="https://picsum.photos/seed/gsap-slide-1/1200/800" alt="Vue extérieure 1" loading="lazy" width="1200" height="800">
                </figure>
                <figure class="gsap-carousel__slide rounded-0 mb-0 overflow-hidden">
                    <img src="https://picsum.photos/seed/gsap-slide-2/1200/800" alt="Vue extérieure 2" loading="lazy" width="1200" height="800">
                </figure>
                <figure class="gsap-carousel__slide rounded-0 mb-0 overflow-hidden">
                    <img src="https://picsum.photos/seed/gsap-slide-3/1200/800" alt="Vue extérieure 3" loading="lazy" width="1200" height="800">
                </figure>
            </div>
        </div>

        <div class="gsap-carousel__controls bg-white px-3 py-2">
            <button type="button" class="btn btn-outline-primary btn-sm gsap-carousel__prev" aria-label="Image précédente">
                <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
            </button>
            <div class="gsap-carousel__dots"></div>
            <button type="button" class="btn btn-outline-primary btn-sm gsap-carousel__next" aria-label="Image suivante">
                <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <p class="text-center text-muted small mt-4 mb-0">
        Glissez horizontalement sur les images · autoplay 4,5&nbsp;s (pause au survol)
    </p>
</div>
