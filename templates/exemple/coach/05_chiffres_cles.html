<!-- Coach — Chiffres dans un bandeau unique (gsap-count-up). Couleurs : config Hermes. -->
<section class="py-5">
    <div class="container col-lg-10">
        <div class="border rounded-4 shadow-sm p-4 p-lg-5">
            <p class="text-uppercase small fw-semibold text-center mb-2" style="letter-spacing: 0.14em;">En quelques chiffres</p>
            <h2 class="h3 fw-bold text-center mb-4 mb-lg-5">Une pratique éprouvée</h2>
            <div class="row g-4 text-center">
                <div class="col-6 col-lg-3">
                    <p class="display-6 fw-bold mb-1"><span data-gsap-count-up="10" data-gsap-count-up-duration="1.4">10</span></p>
                    <p class="small text-uppercase mb-0">ans d’expérience</p>
                </div>
                <div class="col-6 col-lg-3">
                    <p class="display-6 fw-bold mb-1"><span data-gsap-count-up="350" data-gsap-count-up-duration="1.8">350</span>+</p>
                    <p class="small text-uppercase mb-0">personnes accompagnées</p>
                </div>
                <div class="col-6 col-lg-3">
                    <p class="display-6 fw-bold mb-1"><span data-gsap-count-up="95" data-gsap-count-up-duration="1.5">95</span>&nbsp;%</p>
                    <p class="small text-uppercase mb-0">recommandent</p>
                </div>
                <div class="col-6 col-lg-3">
                    <p class="display-6 fw-bold mb-1"><span data-gsap-count-up="48" data-gsap-count-up-duration="1.2">48</span>h</p>
                    <p class="small text-uppercase mb-0">pour un premier créneau</p>
                </div>
            </div>
        </div>
    </div>
</section>
