<!-- Restaurant — Hero type carte Hermes (data-hermes-carte-hero + letter-reveal). Couleurs : carte.css. -->
<section class="py-0">
    <div class="hermes-carte">
        <header data-hermes-carte-hero class="position-relative overflow-hidden">
            <img
                class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover"
                src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&amp;fit=crop&amp;w=1920&amp;h=640&amp;q=80"
                alt="Ambiance du restaurant — salle et bar"
                loading="eager"
                width="1920"
                height="640"
            >
            <div class="hermes-carte-hero-overlay position-absolute top-0 start-0 w-100 h-100" aria-hidden="true"></div>
            <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center text-center px-3 z-1">
                <p data-hermes-carte-hero-kicker class="text-uppercase small fw-semibold mb-2 mb-lg-3">Le Comptoir · Toulouse</p>
                <div class="gsap-letter-reveal">
                    <p
                        class="gsap-letter-reveal__line hermes-carte-hero-title display-1 h-sofia mb-0"
                        data-gsap-letter-reveal-text-value="Carte"
                        aria-label="Carte"
                    >Carte</p>
                </div>
            </div>
        </header>
    </div>
</section>
