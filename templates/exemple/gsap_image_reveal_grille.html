<!--
  Grille 3×3 — apparition GSAP des images
  Défaut : horizontal-alt (alternance gauche / droite)
  Init : initPostContentGsapImageReveal() dans js-front.js

  Attributs sur .gsap-image-reveal :
  - data-gsap-image-reveal-effect-value
      horizontal-alt (défaut) | horizontal-left | horizontal-right
      vertical-alt | vertical-up | vertical-down | fade | scale | blur | rotate
  - data-gsap-image-reveal-offset-value   (px, défaut 120)
  - data-gsap-image-reveal-duration-value (s, défaut 0.75)
  - data-gsap-image-reveal-stagger-value  (s entre images, défaut 0.08)
  - data-gsap-image-reveal-ease-value     (défaut power3.out)
-->
<div class="gsap-image-reveal content-showcase content-showcase--palette-cool text-body py-4">
    <header class="text-center mb-4 px-3">
        <p class="text-uppercase small fw-semibold text-muted mb-2">GSAP · grille d’images</p>
        <h1 class="display-6 fw-bold mb-2">Portfolio — 9 visuels</h1>
        <p class="lead col-lg-8 mx-auto mb-0">
            Arrivée en <strong>alternance gauche / droite</strong> (<code>horizontal-alt</code>).
            Chaque vignette est un <code>.gsap-image-reveal__item</code>.
        </p>
    </header>

    <div class="row g-3 g-md-4 px-2">
        <div class="col-4">
            <figure class="gsap-image-reveal__item ratio ratio-4x3 rounded-3 overflow-hidden shadow-sm mb-0">
                <img src="https://picsum.photos/seed/grille-reveal-1/800/600" alt="Projet 1" width="800" height="600" loading="lazy">
            </figure>
        </div>
