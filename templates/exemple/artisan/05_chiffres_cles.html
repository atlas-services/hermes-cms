<!-- Artisan — Chiffres clés (data-gsap-count-up). Couleurs : config Hermes. -->
<section class="py-5">
    <div class="container">
        <div class="text-center mb-5 col-lg-8 mx-auto">
            <p class="text-uppercase small fw-semibold mb-2" style="letter-spacing: 0.14em;">En quelques chiffres</p>
            <h2 class="h1 fw-bold mb-0">La confiance de nos clients</h2>
        </div>
        <div class="row g-4 text-center">
            <div class="col-6 col-lg-3">
                <p class="display-5 fw-bold mb-1">
                    <span data-gsap-count-up="15" data-gsap-count-up-duration="1.4">15</span>
                </p>
                <p class="small text-uppercase mb-0">ans d’expérience</p>
            </div>
            <div class="col-6 col-lg-3">
                <p class="display-5 fw-bold mb-1">
                    <span data-gsap-count-up="1200" data-gsap-count-up-duration="1.8">1200</span>+
                </p>
                <p class="small text-uppercase mb-0">chantiers réalisés</p>
            </div>
            <div class="col-6 col-lg-3">
                <p class="display-5 fw-bold mb-1">
                    <span data-gsap-count-up="98" data-gsap-count-up-duration="1.5">98</span>&nbsp;%
                </p>
                <p class="small text-uppercase mb-0">clients satisfaits</p>
            </div>
            <div class="col-6 col-lg-3">
                <p class="display-5 fw-bold mb-1">
                    <span data-gsap-count-up="24" data-gsap-count-up-duration="1.2">24</span>h
                </p>
                <p class="small text-uppercase mb-0">délai de réponse</p>
            </div>
        </div>
    </div>
</section>
