<!-- Artisan — Galerie réalisations (Splide focus). Couleurs : config Hermes. -->
<section class="py-5">
    <div class="container">
        <div class="text-center mb-4 col-lg-8 mx-auto">
            <p class="text-uppercase small fw-semibold mb-2" style="letter-spacing: 0.14em;">Portfolio</p>
            <h2 class="h1 fw-bold mb-3">Nos dernières réalisations</h2>
            <p class="mb-0">Quelques chantiers récents — photos remplaçables dans l’admin Hermes.</p>
        </div>
        <div
            class="splide splide-carousel splide-carousel--ratio rounded-3 shadow-sm overflow-hidden"
            aria-label="Galerie des réalisations"
            data-splide-carousel-effect-value="focus"
            data-splide-carousel-per-page-value="3"
            data-splide-carousel-per-page-mobile-value="1"
            data-splide-carousel-breakpoint-value="992"
            data-splide-carousel-gap-value="1rem"
            data-splide-carousel-gap-mobile-value="0"
            data-splide-carousel-autoplay-value="true"
            data-splide-carousel-interval-value="4500"
        >
            <div class="splide__track">
                <ul class="splide__list list-unstyled mb-0">
                    <li class="splide__slide">
                        <img class="img-fluid w-100" src="https://picsum.photos/seed/artisan-real-1/900/600" alt="Rénovation cuisine" width="900" height="600" loading="lazy">
                    </li>
                    <li class="splide__slide">
                        <img class="img-fluid w-100" src="https://picsum.photos/seed/artisan-real-2/900/600" alt="Salle de bain moderne" width="900" height="600" loading="lazy">
                    </li>
                    <li class="splide__slide">
                        <img class="img-fluid w-100" src="https://picsum.photos/seed/artisan-real-3/900/600" alt="Agencement sur mesure" width="900" height="600" loading="lazy">
                    </li>
                    <li class="splide__slide">
                        <img class="img-fluid w-100" src="https://picsum.photos/seed/artisan-real-4/900/600" alt="Terrasse bois" width="900" height="600" loading="lazy">
                    </li>
                    <li class="splide__slide">
                        <img class="img-fluid w-100" src="https://picsum.photos/seed/artisan-real-5/900/600" alt="Rénovation façade" width="900" height="600" loading="lazy">
                    </li>
                </ul>
            </div>
        </div>
    </div>
</section>
